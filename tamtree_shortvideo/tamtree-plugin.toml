[plugin]
name = "shortvideo"
version = "0.1.0"
# Every family this distribution contributes to. An undeclared kind is a boot
# refusal, not a silent skip — `KIND_BY_GROUP` maps each entry-point group to
# the string that must appear here.
kinds = ["node", "credential_type", "curated_backend"]
license = "Apache-2.0"
publisher = "tamtree-community"
homepage = "https://github.com/tamtree-ai/shortvideo"
repository = "https://github.com/tamtree-ai/shortvideo"

[capabilities]
# V1.1 is the first code here that reads a secret and opens a socket: the
# `google_service_account` token mint resolves the credential through
# `ctx.credential` and exchanges a signed assertion at Google's token endpoint.
# Declared now, with that code, rather than ahead of it.
permissions = ["network", "secrets"]
# Boot-inventory truth, not a runtime jail (SEC-G1): the node context is built
# with `egress_block_private` alone and no allowlist, so nothing gates on these
# at run time. They are declared so an operator reviewing the install can see
# where this plugin talks — which is worth something only while the list is
# complete, so each host arrives with the code that reaches it.
#   oauth2.googleapis.com     — the service-account token mint (V1.1)
#   texttospeech.googleapis.com — narration synthesis (V1.2)
#   api.minimax.io            — video generation: create, query, cancel (V2)
#   openrouter.ai             — narration via Gemini 3.1 Flash TTS, and the
#                                per-call cost lookup on the same host (V0.2b)
# Not listed, and deliberately: the finished clip is fetched from a signed,
# time-limited URL on a MiniMax-controlled CDN whose host MiniMax does not
# document. It is learned from a real response, and no real response has been
# seen yet (no key). Listing a guessed host would make this inventory a
# guess, which is worth less than an acknowledged gap.
egress_allowlist = [
  "oauth2.googleapis.com",
  "texttospeech.googleapis.com",
  "api.minimax.io",
  "openrouter.ai",
]

[contracts]
# Pinned to the contracts this plugin is developed and tested against. This is
# a tested floor, not a measured one: no lower SDK has been exercised, so none
# is claimed. V1.1 added a `tamtree.credential_types` contribution, which did
# not move the floor — the group, `CredentialTypeSpec` and the free-`str`
# `auth_kind` all predate 1.33 (§5.1).
#
# Raised 1.33 -> 1.34 by V2.3: `minimax_collect` downloads a generated clip,
# which can exceed `SafeHttpClient`'s 25 MB default, and that cap is a
# constructor argument the node context never exposes. Contracts 1.34.0 added
# `get_bounded` — a per-call size cap with every SSRF and redirect control
# untouched — and this plugin is its first caller. The floor moves because
# `get_bounded` does not exist below it, not as housekeeping.
#
# Raised 1.34 -> 1.36 by V3.2, and again for something that does not exist
# below it. 1.35.0 made the curated-tool contract reachable from outside the
# monorepo (`CuratedBackend`/`Preset` in the SDK, the
# `tamtree.curated_backends` group) — without it this distribution could only
# contribute a renderer by importing `tamtree_nodes.curated`, an unversioned
# server-side module. 1.36.0 added `MediaLimits.limit_address_space`, which
# `RemotionBackend` sets to False: `RLIMIT_AS` caps virtual address space, and
# a browser reserves ~6 TB of it, so under the previous contract the render
# child died during Node's startup on every worker. Neither is optional for
# this plugin — they are the two things that make `shortvideo.compose`
# possible at all.
sdk = "^1.36"

# Documentation for whoever reads the boot inventory; `pyproject.toml` is what
# the registry actually discovers, and nothing validates the two against each
# other. Note the schema's limit: `entry_points` is `dict[str, str]`, so a
# plugin contributing *three* credential types (this one contributes
# `google_service_account`, `minimax_api` and `openrouter_api`) cannot name
# all of them here. The `pyproject.toml` group is authoritative;
# `tests/test_registration.py` is what keeps it honest.
[entry_points]
"tamtree.nodes" = "tamtree_shortvideo:NODES"
"tamtree.credential_types" = "tamtree_shortvideo:GOOGLE_SERVICE_ACCOUNT_CREDENTIAL"
"tamtree.curated_backends" = "tamtree_shortvideo:REMOTION_BACKEND"
