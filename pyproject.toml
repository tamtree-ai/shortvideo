[project]
name = "tamtree-shortvideo"
version = "0.1.0"
description = "Tamtree plugin: short-form video generation — narration, footage and composition."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = [
    "tamtree-plugin-sdk",
    # The RS256 signer behind the `google_service_account` token mint (V1.1).
    # A *plugin* dependency: the server ships pyjwt/cryptography of its own and
    # those are server internals a plugin may not import (§20.2).
    "pyjwt[crypto]>=2.9",
]

[project.optional-dependencies]
testing = ["tamtree-plugin-sdk[testing]"]
dev = [
    "pytest>=8",
    # Only the flow tests read YAML, and only to check the shipped
    # `flows/*.yaml` against the manifests. Not a runtime dependency: nothing
    # in `tamtree_shortvideo` parses YAML.
    "pyyaml>=6",
    "pytest-asyncio>=0.24",
    "ruff>=0.9",
    "mypy>=1.14",
]

[project.urls]
Homepage = "https://github.com/tamtree-ai/shortvideo"
Repository = "https://github.com/tamtree-ai/shortvideo"

[project.entry-points."tamtree.nodes"]
shortvideo = "tamtree_shortvideo:NODES"

# The entry-point NAME is the credential type: this group carries data, so the
# registry has no `.name` to read off the value and falls back to the key — and
# refuses the boot if the two disagree.
# D11: the per-tool half of a curated CLI tool. The entry-point NAME must equal
# the backend's own `id` — the registry keys this family on `id` (it is what
# `ToolSpec.entrypoint` carries and what every error message names) and refuses
# a boot where the two disagree.
[project.entry-points."tamtree.curated_backends"]
remotion = "tamtree_shortvideo:REMOTION_BACKEND"

[project.entry-points."tamtree.credential_types"]
google_service_account = "tamtree_shortvideo:GOOGLE_SERVICE_ACCOUNT_CREDENTIAL"
minimax_api = "tamtree_shortvideo:MINIMAX_API_CREDENTIAL"
openrouter_api = "tamtree_shortvideo:OPENROUTER_API_CREDENTIAL"

[tool.uv.sources]
# Sibling Tamtree checkout at ~/sites/tamtree. Swap for the git URL in README
# when developing without that tree.
tamtree-plugin-sdk = { path = "../../tamtree/packages/plugin-sdk", editable = true }
tamtree-sdk = { path = "../../tamtree/packages/sdk", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tamtree_shortvideo"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["tamtree_shortvideo"]
